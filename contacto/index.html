  <!-- MENÚ ESCRITORIO -->
  <ul class="menu menu-desktop">
    <li><a href="/"  data-i18n="menu_home"></a></li>

        <!-- BOTÓN DE IDIOMA ORIGINAL -->
        <div class="language-selector">
            <button class="lang-btn" id="currentLang" type="button">
                <img src="" alt="" id="langFlag">
                <span class="lang-text" id="langText"></span>
                <span class="arrow">▾</span>
            </button>

            <ul class="lang-dropdown" id="langDropdown">
                <li data-lang="es">
                    <img src="../images/Bandera_de_España.svg.png">
                    <span>Español</span>
                </li>
                <li data-lang="en">
                    <img src="../images/Flag_of_the_United_Kingdom_(3-5).svg.png">
                    <span>English</span>
                </li>
            </ul>
        </div>
    </nav>

<section class="contact-simple">
  <h2
    class="contact-simple-title"
    data-i18n="contact_simple_title">
  </h2>

  <div class="contact-simple-grid">

    <!-- LOCATION -->
    <div class="contact-simple-item">
      <span class="contact-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.5 12 6.5s2.5 1.1 2.5 2.5S13.4 11.5 12 11.5z"/>
        </svg>
      </span>
      <h3 data-i18n="contact_location"></h3>
      <p>La Unión, Antioquia, Colombia</p>
    </div>

    <!-- PHONE -->
    <div class="contact-simple-item">
      <span class="contact-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.6 10.8c1.5 3 3.6 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V21c0 .6-.4 1-1 1C10.3 22 2 13.7 2 3c0-.6.4-1 1-1h4.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1l-2.2 2.2z"/>
        </svg>
      </span>
      <h3 data-i18n="contact_phone"></h3>
      <p>COL : +573147712473</p>
    </div>

    <!-- EMAIL -->
    <div class="contact-simple-item">
      <span class="contact-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </span>
      <h3 data-i18n="contact_email"></h3>
      <p>
        <p>Pasadenaflowerssas@gmail.com</p></p>
      </p>
    </div>

  </div>
</section>


<section class="map-section">
  <h2 class="map-title" data-i18n="contact_title">CONTACT US</h2>

  <div class="map-wrapper">
    <iframe
  src="https://www.google.com/maps?q=5.97209,-75.3698549&t=k&z=15&output=embed"
  width="100%"
  height="450"
  style="border:0;"
  allowfullscreen=""
  loading="lazy">       
    </iframe>
  </div>
</section>



<section class="contact-section">
  <!-- BLOQUE CONTACTO (COLOR) -->
  <div class="contact-main">
<h2 class="contact-title" data-i18n="contact_title"></h2>

    <div class="contact-grid">
<div class="contact-item">
  <h3 data-i18n="contact_phone_title"></h3>
  <p>+573147712473</p>
</div>


      <div class="divider"></div>

<div class="contact-item">
  <h3 data-i18n="contact_service_title"></h3>
  <p data-i18n="contact_service_day_1"></p>

</div>

      <div class="divider"></div>

<div class="contact-item">
  <h3 data-i18n="contact_emails_title"></h3>
  <p>Pasadenaflowerssas@gmail.com</p>

</div>

    </div>
  </div>

  <!-- BLOQUE LOGO (BLANCO) -->
<div class="contact-footer">

  </div>
</div>
